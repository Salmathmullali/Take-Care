{% extends "doctor_discovery/base_telehealth.html" %}

{% block content %}
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-8 col-lg-6">
            <div class="card shadow border-0">
                <div class="card-body p-5">
                    <h2 class="fw-bold mb-4 text-center">Book Appointment</h2>
                    <p class="text-center text-muted mb-4">Consultation with <strong>Dr. {{ doctor.user.first_name }} {{ doctor.user.last_name }}</strong></p>
                    
                    <form method="POST" action="{% url 'telehealth:book_appointment' doctor.id %}">
                        {% csrf_token %}
                        
                        <div class="mb-4">
                            <label class="form-label fw-semibold">Select Date</label>
                            <input type="date" name="date" class="form-control form-control-lg" required>
                        </div>
                        
                        <div class="mb-4">
                            <label class="form-label fw-semibold">Select Time</label>
                            <input type="time" name="time" class="form-control form-control-lg" required>
                            <div class="form-text">Please ensure the time falls within the doctor's weekly availability.</div>
                        </div>

                        <div class="d-grid mt-5">
                            <button type="submit" class="btn btn-primary btn-lg rounded-pill">Confirm Booking</button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
