{% extends 'charity/base.html' %}
{% block title %}Post surplus food{% endblock %}
{% block accent %}#16a34a{% endblock %}
{% block content %}
<h1>Post surplus food listing</h1>
<div class="card"><form method="post">{% csrf_token %}
  {% for field in form %}<div class="form-group"><label>{{ field.label }}</label>{{ field }}{{ field.errors }}</div>{% endfor %}
  <button type="submit" class="btn btn-primary" style="background:var(--food)">Publish listing</button>
</form></div>
{% endblock %}
