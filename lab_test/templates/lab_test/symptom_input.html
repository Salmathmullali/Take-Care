<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Know Your Disease</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .beaker-loader {
            position: relative;
            width: 60px;
            height: 80px;
            border: 4px solid #fff;
            border-top: none;
            border-radius: 0 0 30px 30px;
            margin: 0 auto;
            overflow: hidden;
            background: rgba(255, 255, 255, 0.1);
        }
        .beaker-loader:after {
            content: '';
            position: absolute;
            top: -10px;
            left: -10px;
            right: -10px;
            height: 10px;
            border: 4px solid #fff;
            border-radius: 5px;
        }
        .liquid {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            height: 0%;
            background: #3b82f6;
            animation: fillLiquid 2s infinite alternate;
        }
        .bubbles {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            height: 100%;
            background: transparent;
            overflow: hidden;
        }
        .bubble {
            position: absolute;
            bottom: -10px;
            background: rgba(255,255,255,0.6);
            border-radius: 50%;
            animation: rise 2s infinite ease-in;
        }
        .bubble:nth-child(1) { left: 10%; width: 10px; height: 10px; animation-duration: 1.5s; }
        .bubble:nth-child(2) { left: 40%; width: 6px; height: 6px; animation-duration: 1.2s; animation-delay: 0.5s; }
        .bubble:nth-child(3) { left: 70%; width: 12px; height: 12px; animation-duration: 1.8s; animation-delay: 0.2s; }
        
        @keyframes fillLiquid {
            0% { height: 20%; }
            100% { height: 80%; }
        }
        @keyframes rise {
            0% { bottom: 0; opacity: 1; transform: translateX(0); }
            100% { bottom: 100%; opacity: 0; transform: translateX(-10px); }
        }

        #loading-overlay {
            display: none;
        }
    </style>
</head>
<body class="bg-gray-100 min-h-screen text-gray-800 font-sans">
    
    <div class="max-w-3xl mx-auto pt-20 px-4">
        <div class="bg-white rounded-xl shadow-lg p-8">
            <h1 class="text-3xl font-bold text-center text-blue-600 mb-6">Know Your Disease</h1>
            <p class="text-center text-gray-600 mb-8">Enter your symptoms below to get potential conditions, recommended lab tests, and specialist doctors.</p>
            
            <form id="symptom-form" class="space-y-6">
                <div>
                    <label for="symptoms" class="block text-sm font-medium text-gray-700 mb-2">Describe Your Symptoms</label>
                    <textarea id="symptoms" name="symptoms" rows="4" class="w-full border-gray-300 rounded-lg shadow-sm focus:border-blue-500 focus:ring-blue-500 p-3 border" placeholder="e.g., fever, persistent cough, fatigue..." required></textarea>
                </div>
                
                <!-- CSRF Token (manually passing as meta/input is needed if not using Django form rendering, wait, we can just use {% csrf_token %}) -->
                {% csrf_token %}
                
                <button type="submit" class="w-full flex justify-center py-3 px-4 border border-transparent rounded-md shadow-sm text-lg font-medium text-white bg-blue-600 hover:bg-blue-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-blue-500 transition-colors">
                    Analyze Symptoms
                </button>
            </form>
        </div>
    </div>

    <!-- Loading Overlay -->
    <div id="loading-overlay" class="fixed inset-0 bg-blue-900 bg-opacity-90 z-50 flex flex-col items-center justify-center">
        <div class="beaker-loader mb-8">
            <div class="liquid">
                <div class="bubbles">
                    <div class="bubble"></div>
                    <div class="bubble"></div>
                    <div class="bubble"></div>
                </div>
            </div>
        </div>
        <h2 class="text-2xl font-bold text-white tracking-widest animate-pulse">Analyzing symptoms in the lab...</h2>
    </div>

    <script>
        document.getElementById('symptom-form').addEventListener('submit', function(e) {
            e.preventDefault();
            
            // Show loading overlay
            document.getElementById('loading-overlay').style.display = 'flex';
            
            const formData = new FormData(this);
            const csrfToken = document.querySelector('[name=csrfmiddlewaretoken]').value;
            
            fetch("{% url 'lab_test:analyze_symptoms' %}", {
                method: 'POST',
                body: formData,
                headers: {
                    'X-CSRFToken': csrfToken
                }
            })
            .then(response => response.json())
            .then(data => {
                if(data.status === 'success') {
                    window.location.href = data.redirect_url;
                } else {
                    alert('An error occurred while analyzing symptoms.');
                    document.getElementById('loading-overlay').style.display = 'none';
                }
            })
            .catch(error => {
                console.error('Error:', error);
                document.getElementById('loading-overlay').style.display = 'none';
            });
        });
    </script>
</body>
</html>
